name: labeltransfer
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=2.0
  - scipy
  - scikit-learn
  - h5py
  - matplotlib
  - anndata=0.10.7
  - scanpy=1.10.2

  # OPTIONAL: remove cudatoolkit if CPU-only
  - cudatoolkit=11.8

  - pip:
      - torch==2.2.2+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
      - torchvision==0.17.2+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
      - torchaudio==2.2.2+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
      - scvi-tools==1.3.3
      - scarches==0.6.5

variables:
  SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL: "True"
